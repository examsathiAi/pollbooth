name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check API
        run: pnpm --filter @pollbooth/api typecheck

      - name: Type-check Web
        run: pnpm --filter @pollbooth/web typecheck

      - name: Type-check Admin
        run: pnpm --filter @pollbooth/admin typecheck

      - name: Validate Docker build config
        run: docker build -f apps/api/Dockerfile . >/dev/null && docker build -f apps/web/Dockerfile . >/dev/null && docker build -f apps/admin/Dockerfile . >/dev/null
